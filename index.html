<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defensa Entrópica</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f32;--tile:#1a2a40;--line:#30415a;--text:#edf4ff;--muted:#9bafc9;--accent:#6ee7b7;--path:#8d7550}body.light{color-scheme:light;--bg:#edf2f7;--panel:#fff;--tile:#dde8ef;--line:#bdcddd;--text:#172a40;--muted:#52657c;--accent:#08795b;--path:#c6ad7e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--tile);color:var(--text);padding:10px 14px;border-radius:10px;min-height:42px}button:hover,button.active{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:var(--bg);font-weight:750}button:disabled{opacity:.4;cursor:default}input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:8px;max-width:100%;width:100%}header,main,footer{width:min(1240px,100%);margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(22px,4vw,36px);margin:0}h2,h3{margin:0 0 14px}p{line-height:1.6;color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.hero{padding:clamp(25px,7vw,80px);background:linear-gradient(120deg,var(--panel),var(--tile));border-radius:24px}.hero h2{font-size:clamp(32px,7vw,65px);max-width:750px}.eyebrow{color:var(--accent);letter-spacing:3px;font-size:12px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:24px}.cards button{text-align:left;padding:25px;font-size:20px}.cards small{display:block;font-size:13px;color:var(--muted);margin-top:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.boardwrap{position:relative;width:100%;border-radius:15px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tools button{flex:1 0 auto}.field{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}.field input,.field select{margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:8px 13px;background:var(--tile);border-radius:9px}.hint{font-size:13px}.room{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:15px 0}.room strong{flex:1;min-width:160px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(700px,94vw);max-height:90vh;padding:24px}dialog::backdrop{background:#000a}.wave{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.group{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;margin:8px 0}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:14px 22px;border-radius:12px;z-index:10;max-width:94vw;text-align:center;pointer-events:none}footer{text-align:center;font-size:13px}footer a{color:var(--muted)}.hidden{display:none!important}.tower{width:100%;margin:4px 0;text-align:left}.badge{color:var(--accent)}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.cards button{padding:18px}.layout aside{order:2}header,main{padding:12px}.panel{padding:12px}.group{grid-template-columns:1.3fr 1fr auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><div><span class="eyebrow">MANDRÁGORA / JUEGOS</span><h1>Defensa Entrópica</h1></div><div class="row"><button id="theme" aria-label="Cambiar tema">☀ Claro</button><button id="sound">♫ Sonido: sí</button></div></header><main id="app"></main><footer><a href="https://jaid227.github.io/EntropiaDigital/" target="_blank" rel="noopener noreferrer">→ © 2026 Mandrágora Entrópica | Desarrollo Web Estratégico ←</a></footer><dialog id="modal"></dialog><div id="toast" class="notice hidden" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const EN=[{name:'Soldado',icon:'●',hp:10,speed:1,leak:1,color:'#fb7185'},{name:'Carrito',icon:'▰',hp:20,speed:1.65,leak:2,color:'#fbbf24'},{name:'Carro mediano',icon:'▰',hp:30,speed:1.15,leak:3,color:'#fb923c'},{name:'Carro grande',icon:'▰',hp:50,speed:.7,leak:10,color:'#c084fc'}];
const TW=[['Torre chica',1,1.2,2.5,35],['Torre mediana',3,.8,2.8,65],['Torre grande',5,.4,3,110],['Láser chica',8,1.2,3,150],['Láser mediana',10,.8,3.3,210],['Láser grande',15,.4,3.5,290],['Alentadora',0,.3,2.8,90],['Bomba',0,3,2,180]];
let db;try{db=JSON.parse(localStorage.getItem('defensa-entropica-v1'))}catch{}if(!db||!Array.isArray(db.rooms)||!Array.isArray(db.route))db={rooms:[],route:[],wins:[]};db.wins??=[];
let room,tool='path',screen='home',game=null,canvas,ctx,routeIndex=-1,soundOn=true,audio,dirty=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('defensa-entropica-v1',JSON.stringify(db));return true}catch{toast('No se pudo guardar. Exporta una copia JSON.');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function beep(f=440,d=.06){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function applyTheme(light){document.body.classList.toggle('light',light);$('#theme').textContent=light?'☾ Nocturno':'☀ Claro';try{localStorage.setItem('defensa-theme',light?'light':'dark')}catch{}draw()}
$('#theme').onclick=()=>applyTheme(!document.body.classList.contains('light'));$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent='♫ Sonido: '+(soundOn?'sí':'no');beep()};try{applyTheme(localStorage.getItem('defensa-theme')==='light')}catch{}
function fresh(){return {id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:'Nuevo cuarto',w:16,h:12,path:[],hq:null,bases:[],hp:100,money:350,allowed:TW.map((_,i)=>i),enemies:clone(EN),waves:Array.from({length:3},(_,i)=>[{type:i%3,count:5}])}}
function nav(s){if(screen==='editor'&&dirty&&!confirm('Hay cambios sin guardar. ¿Salir del editor?'))return;game=null;screen=s;dirty=false;if(s==='home')home();else list(s)}
function home(){screen='home';$('#app').innerHTML=`<section class="hero"><div class="eyebrow">CONSTRUYE · PRUEBA · RESISTE</div><h2>Tu camino.<br>Tu última defensa.</h2><p>Diseña un recorrido, prepara las hordas y convierte cada base en una oportunidad para resistir.</p><div class="cards"><button onclick="newRoom()">＋ Crear<small>Diseña un nuevo campo de batalla</small></button><button onclick="nav('route')">⚑ Historial y ruta<small>Ordena los cuartos y juega la campaña</small></button><button onclick="nav('saved')">▦ Cuartos guardados<small>Continúa editando tus diseños</small></button></div></section><section class="panel" style="margin-top:18px"><h3>Cómo jugar</h3><p>Coloca el cuartel enemigo → extiende un camino sin cruces → coloca tu cuartel al final. Añade bases y elige las torres disponibles. Durante la partida, toca una base para construir; elimina enemigos para ganar créditos.</p><div class="row"><button onclick="demo()">▶ Probar cuarto de ejemplo</button><button onclick="exportAll()">↓ Exportar respaldo</button><button onclick="document.getElementById('import').click()">↑ Importar respaldo</button><input class="hidden" id="import" type="file" accept=".json,application/json" onchange="importAll(this)"></div><p class="hint">Los cuartos se guardan en este navegador. Exporta un respaldo para trasladarlos a otro dispositivo.</p></section>`}
function newRoom(){room=fresh();dirty=false;editor()}
function demo(){room=fresh();room.name='Primera línea';room.path=[{x:1,y:2},...Array.from({length:11},(_,i)=>({x:i+2,y:2})),{x:12,y:3},{x:12,y:4},...Array.from({length:11},(_,i)=>({x:11-i,y:4})),{x:1,y:5},{x:1,y:6},...Array.from({length:12},(_,i)=>({x:i+2,y:6}))];room.hq={x:14,y:6};room.bases=[{x:4,y:3},{x:8,y:3},{x:4,y:5},{x:8,y:5},{x:12,y:7}];editor()}
function editor(){game=null;screen='editor';$('#app').innerHTML=`<div class="row" style="margin-bottom:14px"><button onclick="nav('home')">← Inicio</button><input aria-label="Nombre del cuarto" id="name" style="flex:1;min-width:140px" maxlength="60" value="${esc(room.name)}" oninput="room.name=this.value;dirty=true"><button onclick="saveRoom()">Guardar</button><button class="primary" onclick="startGame(false)">▶ Probar</button></div><div class="layout"><section class="panel"><div class="tools">${[['spawn','⚑ Enemigo'],['path','━ Camino'],['hq','⌂ Mi cuartel'],['base','▣ Base'],['inspect','⚙ Configurar'],['erase','⌫ Borrar']].map(([id,n])=>`<button data-tool="${id}" onclick="setTool('${id}')">${n}</button>`).join('')}</div><div class="boardwrap"><canvas id="board" aria-label="Tablero del editor"></canvas></div><p id="help" class="hint"></p><div class="row"><button onclick="undoPath()">↶ Quitar último tramo</button><button onclick="configWaves()">⚑ Configurar hordas</button></div></section><aside><section class="panel"><h3>Reglas del cuarto</h3><div class="two"><label class="field">Columnas<select onchange="resizeRoom(+this.value,room.h)">${[10,12,16,20,24].map(n=>`<option ${n===room.w?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Filas<select onchange="resizeRoom(room.w,+this.value)">${[8,10,12,16,20].map(n=>`<option ${n===room.h?'selected':''}>${n}</option>`).join('')}</select></label></div><label class="field">Vida de tu cuartel<input type="number" min="1" max="10000" value="${room.hp}" onchange="room.hp=bounded(this.value,1,10000,100);dirty=true;this.value=room.hp"></label><label class="field">Créditos iniciales<input type="number" min="0" max="100000" value="${room.money}" onchange="room.money=bounded(this.value,0,100000,350);dirty=true;this.value=room.money"></label><h3>Torres disponibles</h3>${TW.map((t,i)=>`<label class="row hint" style="margin:8px 0"><input style="width:auto" type="checkbox" ${room.allowed.includes(i)?'checked':''} onchange="toggleTower(${i},this.checked)">${t[0]} · ${t[4]} ¤</label>`).join('')}<p class="hint">Daño / intervalo: 1/1.2s, 3/0.8s, 5/0.4s; láser: 8/1.2s, 10/0.8s y 15/0.4s. La alentadora reduce velocidad al 45%. La bomba elimina en un radio de 1.2 casillas y recarga en 3s.</p></section></aside></div>`;setupCanvas();setTool(tool)}
function bounded(v,min,max,f){v=Number(v);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):f}
function toggleTower(i,on){room.allowed=on?[...new Set([...room.allowed,i])]:room.allowed.filter(x=>x!==i);dirty=true}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if($('#help'))$('#help').textContent={spawn:'Coloca el cuartel enemigo en una casilla vacía. Tócalo otra vez para configurar hordas.',path:'Toca casillas vecinas al último tramo. No se permiten cruces ni tramos que se toquen lateralmente.',hq:'Coloca tu cuartel junto al último tramo. Cerrará el recorrido.',base:'Coloca bases en casillas libres. Las torres se construyen durante la partida.',inspect:'Toca el cuartel enemigo para configurar hordas o tu cuartel para editar su vida.',erase:'Toca una base, tu cuartel o el último tramo para borrarlo.'}[t];draw()}
const eq=(a,b)=>a&&b&&a.x===b.x&&a.y===b.y,dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
function occupied(p){return room.path.some(q=>eq(p,q))||eq(p,room.hq)||room.bases.some(q=>eq(p,q))}
function setupCanvas(){canvas=$('#board');ctx=canvas.getContext('2d');canvas.width=room.w*48;canvas.height=room.h*48;canvas.onclick=e=>{let r=canvas.getBoundingClientRect();let p={x:Math.floor((e.clientX-r.left)/r.width*room.w),y:Math.floor((e.clientY-r.top)/r.height*room.h)};if(p.x>=0&&p.y>=0&&p.x<room.w&&p.y<room.h){beep(300,.025);if(game)baseMenu(p);else editCell(p)}};draw()}
function editCell(p){if(eq(p,room.path[0])&&tool!=='erase'){configWaves();return}if(tool==='inspect'){if(eq(p,room.hq)){let v=prompt('Vida del cuartel',room.hp);if(v!==null){room.hp=bounded(v,1,10000,100);dirty=true;editor()}}return}if(tool==='erase'){let b=room.bases.findIndex(q=>eq(p,q));if(b>=0)room.bases.splice(b,1);else if(eq(p,room.hq))room.hq=null;else if(eq(p,room.path.at(-1))&&!room.hq)room.path.pop();else return toast('Borra primero el cuartel final y después el camino desde el final.');dirty=true;draw();return}if(occupied(p))return toast('Esa casilla ya está ocupada.');if(tool==='spawn'){if(room.path.length)return toast('Solo puede haber un cuartel enemigo.');room.path.push(p);dirty=true;draw();configWaves();return}if(tool==='base')room.bases.push(p);else {if(!room.path.length)return toast('Coloca primero el cuartel enemigo.');if(room.hq)return toast('Quita tu cuartel antes de extender el camino.');if(dist(p,room.path.at(-1))!==1)return toast('Continúa desde el último tramo, sin diagonales.');if(room.path.filter(q=>dist(p,q)===1).length!==1)return toast('Ese tramo crearía una conexión adicional.');if(tool==='hq'){if(room.path.length<2)return toast('Coloca al menos un tramo de camino.');room.hq=p}else room.path.push(p)}dirty=true;draw()}
function undoPath(){if(room.hq)room.hq=null;else room.path.pop();dirty=true;draw()}
function resizeRoom(w,h){if([...room.path,...room.bases,...(room.hq?[room.hq]:[])].some(p=>p.x>=w||p.y>=h))return toast('Quita los objetos fuera del nuevo tamaño primero.');room.w=w;room.h=h;dirty=true;editor()}
function valid(r){if(!r.path||r.path.length<2||!r.hq)return 'Falta conectar los dos cuarteles con un camino.';let cells=[...r.path,r.hq];let keys=new Set;for(let i=0;i<cells.length;i++){let p=cells[i];if(!Number.isInteger(p.x)||!Number.isInteger(p.y)||p.x<0||p.x>=r.w||p.y<0||p.y>=r.h||keys.has(p.x+','+p.y))return 'Camino inválido.';keys.add(p.x+','+p.y);if(i&&dist(p,cells[i-1])!==1)return 'El camino está desconectado.';if(cells.filter(q=>dist(p,q)===1).length!==(i===0||i===cells.length-1?1:2))return 'El camino tiene conexiones adicionales.'}if(!r.allowed.length||!r.bases.length)return 'Añade al menos una base y una torre disponible.';return ''}
function saveRoom(){room.name=room.name.trim()||'Cuarto sin nombre';let i=db.rooms.findIndex(r=>r.id===room.id);let old=clone(db.rooms);if(i<0)db.rooms.push(clone(room));else db.rooms[i]=clone(room);if(persist()){dirty=false;toast('Cuarto guardado. Puedes añadirlo a la ruta desde el historial.')}else db.rooms=old}
function showModal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function configWaves(){let draft=clone(room);window.waveDraft=draft;renderWaves()}
function renderWaves(){let d=window.waveDraft;showOrUpdate(`<h2>Cuartel enemigo</h2><p class="hint">Configura 3–12 hordas. Cada grupo contiene de 5 a 10 unidades y aparece en fila. Combina varios grupos por horda.</p><label class="field">Número de hordas<input type="number" min="3" max="12" value="${d.waves.length}" onchange="changeWaves(this.value)"></label><details><summary>Características de los enemigos</summary>${d.enemies.map((e,i)=>`<div class="wave"><b>${e.name}</b><div class="two">${[['hp','Vida',1,10000],['speed','Velocidad (casillas/s)',.1,5],['leak','Daño al cuartel',1,1000]].map(([k,n,min,max])=>`<label class="field">${n}<input type="number" step="${k==='speed'?'.1':'1'}" min="${min}" max="${max}" value="${e[k]}" onchange="waveDraft.enemies[${i}].${k}=bounded(this.value,${min},${max},${e[k]})"></label>`).join('')}</div></div>`).join('')}<p class="hint">Los enemigos avanzan hacia el cuartel y le hacen daño al llegar; no disparan a las torres, por lo que su ataque se configura como daño de llegada.</p></details>${d.waves.map((w,i)=>`<div class="wave"><b>Horda ${i+1}</b>${w.map((g,j)=>`<div class="group"><select aria-label="Tipo de enemigo" onchange="waveDraft.waves[${i}][${j}].type=+this.value">${EN.map((e,k)=>`<option value="${k}" ${g.type===k?'selected':''}>${e.name}</option>`).join('')}</select><input aria-label="Cantidad de enemigos" type="number" min="5" max="10" value="${g.count}" onchange="waveDraft.waves[${i}][${j}].count=Math.round(bounded(this.value,5,10,5));this.value=waveDraft.waves[${i}][${j}].count"><button aria-label="Quitar grupo" onclick="if(waveDraft.waves[${i}].length>1){waveDraft.waves[${i}].splice(${j},1);renderWaves()}">×</button></div>`).join('')}<button onclick="if(waveDraft.waves[${i}].length<8){waveDraft.waves[${i}].push({type:0,count:5});renderWaves()}">＋ Grupo</button></div>`).join('')}<div class="row"><button class="primary" onclick="room.waves=waveDraft.waves;room.enemies=waveDraft.enemies;dirty=true;document.getElementById('modal').close();draw()">Aplicar</button><button onclick="document.getElementById('modal').close()">Cancelar</button></div>`)}
function showOrUpdate(h){$('#modal').innerHTML=h;if(!$('#modal').open)$('#modal').showModal()}
function changeWaves(n){n=Math.round(bounded(n,3,12,3));let d=waveDraft;while(d.waves.length<n)d.waves.push([{type:0,count:5}]);d.waves.length=n;renderWaves()}
function list(s){let route=s==='route';$('#app').innerHTML=`<div class="row"><button onclick="nav('home')">← Inicio</button><h2>${route?'Historial · Ruta de defensa':'Cuartos guardados'}</h2></div><p>${route?'Añade cuartos guardados y ordénalos para jugarlos como una campaña. Cada cuarto comienza con sus propios recursos.':'Edita tus diseños o juega cada cuarto por separado.'}</p><section class="panel">${route?`<div class="row"><select id="addRoom" style="flex:1">${db.rooms.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><button onclick="addRoute()">＋ Añadir a ruta</button><button class="primary" ${db.route.length?'':'disabled'} onclick="playRoute(0)">▶ Jugar ruta</button></div>`:''}<div>${(route?db.route.map(id=>db.rooms.find(r=>r.id===id)).filter(Boolean):db.rooms).map((r,i)=>`<div class="room"><strong>${route?i+1+'. ':''}${esc(r.name)} ${db.wins.includes(r.id)?'✓':''}</strong><span class="hint">${r.waves.length} hordas · ${r.hp} ♥</span>${route?`<button onclick="moveRoute(${i},-1)" ${i===0?'disabled':''}>↑</button><button onclick="moveRoute(${i},1)" ${i===db.route.length-1?'disabled':''}>↓</button><button onclick="db.route.splice(${i},1);persist();list('route')">Quitar</button>`:`<button onclick="editSaved('${r.id}')">Editar</button><button onclick="playSaved('${r.id}')">Jugar</button><button onclick="deleteRoom('${r.id}')">Eliminar</button>`}</div>`).join('')||'<p>Aún no hay cuartos aquí.</p>'}</div></section>`}
function editSaved(id){room=clone(db.rooms.find(r=>r.id===id));dirty=false;editor()}function playSaved(id){room=clone(db.rooms.find(r=>r.id===id));startGame(false,'saved')}
function deleteRoom(id){if(!confirm('¿Eliminar este cuarto y quitarlo de la ruta?'))return;db.rooms=db.rooms.filter(r=>r.id!==id);db.route=db.route.filter(x=>x!==id);persist();list('saved')}
function addRoute(){let id=$('#addRoom').value;if(!id)return;db.route.push(id);persist();list('route')}
function moveRoute(i,d){let j=i+d;if(j<0||j>=db.route.length)return;[db.route[i],db.route[j]]=[db.route[j],db.route[i]];persist();list('route')}
function playRoute(i){routeIndex=i;let r=db.rooms.find(r=>r.id===db.route[i]);if(!r)return toast('No hay cuartos en la ruta.');room=clone(r);startGame(true,'route')}
function exportAll(){download(JSON.stringify({format:'defensa-entropica',version:1,...db},null,2),'defensa-entropica-respaldo.json')}
function download(text,name){let url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeRoom(r){if(!r||typeof r.id!=='string'||!/^[\w-]{1,100}$/.test(r.id)||typeof r.name!=='string'||r.name.length>60||![10,12,16,20,24].includes(r.w)||![8,10,12,16,20].includes(r.h))throw Error();let ps=[...r.path,...r.bases,...(r.hq?[r.hq]:[])];if(ps.length>r.w*r.h||ps.some(p=>!Number.isInteger(p.x)||!Number.isInteger(p.y)||p.x<0||p.x>=r.w||p.y<0||p.y>=r.h))throw Error();if(new Set(ps.map(p=>p.x+','+p.y)).size!==ps.length)throw Error();if(!Array.isArray(r.allowed)||r.allowed.some(i=>!Number.isInteger(i)||i<0||i>7)||!Number.isFinite(r.hp)||r.hp<1||r.hp>10000||!Number.isFinite(r.money)||r.money<0||r.money>100000||r.waves.length<3||r.waves.length>12||r.waves.some(w=>!Array.isArray(w)||!w.length||w.length>8||w.some(g=>!Number.isInteger(g.type)||g.type<0||g.type>3||!Number.isInteger(g.count)||g.count<5||g.count>10)))throw Error();if(r.enemies.length!==4||r.enemies.some(e=>!Number.isFinite(e.hp)||e.hp<1||e.hp>10000||!Number.isFinite(e.speed)||e.speed<.1||e.speed>5||!Number.isFinite(e.leak)||e.leak<1||e.leak>1000))throw Error();r.enemies=r.enemies.map((e,i)=>({...EN[i],hp:e.hp,speed:e.speed,leak:e.leak}));return r}
async function importAll(input){try{let file=input.files[0];if(!file)return;if(file.size>2000000)throw Error();let data=JSON.parse(await file.text());if(data.format!=='defensa-entropica'||data.version!==1||!Array.isArray(data.rooms)||data.rooms.length>200||!Array.isArray(data.route)||data.route.length>1000)throw Error();data.rooms.forEach(safeRoom);if(new Set(data.rooms.map(r=>r.id)).size!==data.rooms.length||data.route.some(id=>!data.rooms.some(r=>r.id===id)))throw Error();if(!confirm('¿Importar el respaldo? Reemplazará los cuartos de este navegador.'))return;db={rooms:data.rooms,route:data.route,wins:Array.isArray(data.wins)?data.wins.filter(id=>data.rooms.some(r=>r.id===id)):[]};persist();home();toast('Respaldo importado.')}catch{toast('El respaldo no es válido.')}input.value=''}
function startGame(route=false,origin='editor'){let error=valid(room);if(error)return toast(error);screen='game';game={route,origin,hp:room.hp,money:room.money,wave:-1,enemies:[],towers:[],queue:[],spawn:0,wait:0,running:false,paused:false,speed:1,kills:0,effects:[],done:false};$('#app').innerHTML=`<div class="row" style="margin-bottom:14px"><button onclick="exitGame()">← ${origin==='editor'?'Editor':'Salir'}</button><h2 style="margin:0;flex:1">${esc(room.name)}</h2><button id="pause" onclick="game.paused=!game.paused;this.textContent=game.paused?'▶ Continuar':'Ⅱ Pausa'">Ⅱ Pausa</button><button onclick="game.speed=game.speed===1?2:1;this.textContent=game.speed+'×'">1×</button></div><div class="row" id="hud" style="margin-bottom:12px"></div><div class="layout"><section class="panel"><div class="boardwrap"><canvas id="board" aria-label="Tablero de defensa"></canvas></div><p class="hint">Toca una base ▣ para construir una torre. Toca una torre para consultar su alcance o venderla.</p></section><aside class="panel"><h3>Centro de mando</h3><p id="status">Prepara tus defensas antes de comenzar.</p><button class="primary" id="next" onclick="nextWave()">▶ Iniciar primera horda</button><p class="hint">Cada baja otorga 8 créditos. Completar una horda otorga 30. Puedes construir durante los ataques. La bomba se recarga después de cada explosión.</p><div id="result"></div></aside></div>`;setupCanvas();hud();draw()}
function exitGame(){let origin=game.origin;if(!game.done&&!confirm('¿Salir de la partida? Se perderá este intento.'))return;game=null;if(origin==='editor')editor();else nav(origin)}
function nextWave(){let g=game;if(!g||g.running||g.done)return;g.wave++;g.queue=room.waves[g.wave].flatMap(gr=>Array.from({length:gr.count},()=>gr.type));g.spawn=0;g.running=true;$('#next').disabled=true;$('#status').textContent='Horda en marcha. Protege el cuartel.';beep(600,.15);hud()}
function hud(){if(!game)return;$('#hud').innerHTML=`<span class="stat">♥ ${Math.max(0,game.hp)} / ${room.hp}</span><span class="stat">¤ ${game.money}</span><span class="stat">Horda ${Math.max(0,game.wave+1)} / ${room.waves.length}</span><span class="stat">Bajas ${game.kills}</span>${game.route?`<span class="stat">Cuarto ${routeIndex+1} / ${db.route.length}</span>`:''}`}
function pos(e){let path=[...room.path,room.hq],i=Math.min(Math.floor(e.p),path.length-2),t=Math.min(1,e.p-i);return {x:path[i].x+(path[i+1].x-path[i].x)*t,y:path[i].y+(path[i+1].y-path[i].y)*t}}
function baseMenu(p){let g=game;if(g.done)return;let t=g.towers.find(t=>eq(t,p));if(!room.bases.some(b=>eq(b,p)))return;g.selected=p;g.modalPause=true;draw();if(t){showModal(`<h2>${TW[t.type][0]}</h2><p>Alcance: ${TW[t.type][3]} casillas. ${t.type===6?'Reduce velocidad al 45%.':t.type===7?'Elimina enemigos en el área de explosión.':`Daño: ${TW[t.type][1]}. Intervalo: ${TW[t.type][2]} s.`}</p><div class="row"><button onclick="sellTower(${p.x},${p.y})">Vender · +${Math.floor(TW[t.type][4]*.6)} ¤</button><button onclick="document.getElementById('modal').close()">Cerrar</button></div>`)}else showModal(`<h2>Construir torre</h2><p>Créditos disponibles: ${g.money} ¤</p>${room.allowed.map(i=>`<button class="tower" ${g.money<TW[i][4]?'disabled':''} onclick="buildTower(${p.x},${p.y},${i})">${TW[i][0]} · ${TW[i][4]} ¤ <small> / alcance ${TW[i][3]}</small></button>`).join('')}<button onclick="document.getElementById('modal').close()">Cancelar</button>`)}
$('#modal').addEventListener('close',()=>{if(game){game.modalPause=false;game.selected=null;draw()}});
function buildTower(x,y,type){let g=game,c=TW[type][4];if(g.money<c||g.towers.some(t=>t.x===x&&t.y===y))return;g.money-=c;g.towers.push({x,y,type,cd:0});$('#modal').close();beep(850,.1);hud();draw()}
function sellTower(x,y){let g=game,i=g.towers.findIndex(t=>t.x===x&&t.y===y);if(i<0)return;g.money+=Math.floor(TW[g.towers[i].type][4]*.6);g.towers.splice(i,1);$('#modal').close();hud();draw()}
function step(dt){let g=game;if(!g||g.paused||g.modalPause||g.done)return;dt*=g.speed;g.effects=g.effects.filter(f=>(f.life-=dt)>0);if(g.running&&g.queue.length){g.spawn-=dt;if(g.spawn<=0){let type=g.queue.shift(),e=room.enemies[type];g.enemies.push({type,p:0,hp:e.hp,max:e.hp});g.spawn=.65}}
for(let t of g.towers)t.cd=Math.max(0,t.cd-dt);
for(let e of g.enemies){let p=pos(e),slow=g.towers.some(t=>t.type===6&&Math.hypot(t.x-p.x,t.y-p.y)<=TW[6][3]);e.p+=room.enemies[e.type].speed*dt*(slow?.45:1)}
for(let t of g.towers){if(t.type===6||t.cd>0)continue;let spec=TW[t.type],targets=g.enemies.filter(e=>e.hp>0&&Math.hypot(pos(e).x-t.x,pos(e).y-t.y)<=spec[3]).sort((a,b)=>b.p-a.p);if(!targets.length)continue;let target=targets[0],p=pos(target);t.cd=spec[2];if(t.type===7){for(let e of g.enemies)if(Math.hypot(pos(e).x-p.x,pos(e).y-p.y)<=1.2)e.hp=0;g.effects.push({kind:'boom',x:p.x,y:p.y,life:.35});beep(90,.12)}else{target.hp-=spec[1];g.effects.push({kind:'shot',x:t.x,y:t.y,tx:p.x,ty:p.y,laser:t.type>=3,life:.12});beep(t.type>=3?980:480,.025)}}
let survivors=[];for(let e of g.enemies){if(e.hp<=0){g.money+=8;g.kills++}else if(e.p>=room.path.length){g.hp-=room.enemies[e.type].leak;beep(140,.12)}else survivors.push(e)}g.enemies=survivors;
if(g.hp<=0)finish(false);else if(g.running&&!g.queue.length&&!g.enemies.length){g.running=false;g.money+=30;if(g.wave===room.waves.length-1)finish(true);else{$('#next').disabled=false;$('#next').textContent='▶ Iniciar horda '+(g.wave+2);$('#status').textContent='Horda superada. Refuerza tus defensas.';beep(900,.2)}}hud()}
function finish(win){game.done=true;game.running=false;$('#next').disabled=true;$('#status').textContent=win?'¡Cuartel protegido!':'El cuartel ha caído.';if(win){if(!db.wins.includes(room.id)&&db.rooms.some(r=>r.id===room.id)){db.wins.push(room.id);persist()}}$('#result').innerHTML=`<h2 style="margin-top:20px">${win?'Victoria ✓':'Derrota'}</h2><p>${game.kills} enemigos eliminados.</p><button onclick="startGame(game.route,game.origin)">↻ Reintentar</button>${win&&game.route&&routeIndex<db.route.length-1?'<button class="primary" onclick="playRoute(routeIndex+1)">Siguiente cuarto →</button>':''}${win&&game.route&&routeIndex===db.route.length-1?'<p class="badge">¡Completaste toda la ruta!</p>':''}`;beep(win?1000:100,.4)}
function draw(){if(!canvas||!ctx||!room||!document.contains(canvas))return;let light=document.body.classList.contains('light');ctx.clearRect(0,0,canvas.width,canvas.height);let S=48;for(let y=0;y<room.h;y++)for(let x=0;x<room.w;x++){ctx.fillStyle=light?((x+y)%2?'#dfe9e9':'#e7efee'):((x+y)%2?'#172a32':'#1a3038');ctx.fillRect(x*S,y*S,S-1,S-1)}
let path=[...room.path,...(room.hq?[room.hq]:[])];if(path.length){ctx.strokeStyle=light?'#bc9e70':'#89714b';ctx.lineWidth=32;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo((p.x+.5)*S,(p.y+.5)*S):ctx.moveTo((p.x+.5)*S,(p.y+.5)*S));ctx.stroke();ctx.fillStyle='#ffffff55';for(let i=1;i<path.length-1;i++){let p=path[i],a=path[i-1];ctx.save();ctx.translate((p.x+.5)*S,(p.y+.5)*S);ctx.rotate(Math.atan2(p.y-a.y,p.x-a.x));ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(3,0);ctx.lineTo(-4,4);ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
function block(p,color,label){if(!p)return;ctx.fillStyle=color;ctx.fillRect(p.x*S+5,p.y*S+5,38,38);ctx.fillStyle='#fff';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,(p.x+.5)*S,(p.y+.5)*S)}
for(let b of room.bases){ctx.strokeStyle='#72bcb1';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(b.x*S+7,b.y*S+7,34,34);ctx.setLineDash([]);ctx.fillStyle='#72bcb1';ctx.font='19px system-ui';ctx.textAlign='center';ctx.fillText('+',(b.x+.5)*S,(b.y+.5)*S)}block(room.path[0],'#a63d50','⚑');block(room.hq,'#287d8c','⌂');
if(game){for(let t of game.towers){if(eq(t,game.selected)||t.type===6){ctx.beginPath();ctx.arc((t.x+.5)*S,(t.y+.5)*S,TW[t.type][3]*S,0,Math.PI*2);ctx.fillStyle=t.type===6?'#6ee7b712':'#79b8ff20';ctx.fill();ctx.strokeStyle='#6ee7b744';ctx.stroke()}ctx.fillStyle=['#84ccbd','#38bdf8','#2563eb','#f0abfc','#d946ef','#9333ea','#4ade80','#fb923c'][t.type];ctx.beginPath();ctx.arc((t.x+.5)*S,(t.y+.5)*S,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10202a';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.type===6?'≈':t.type===7?'✹':String(t.type+1),(t.x+.5)*S,(t.y+.5)*S)}for(let e of game.enemies){let p=pos(e),x=(p.x+.5)*S,y=(p.y+.5)*S;ctx.fillStyle=EN[e.type].color;let size=[8,10,13,16][e.type];ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();ctx.fillStyle='#16222b';ctx.font='bold 12px system-ui';ctx.fillText(String(e.type+1),x,y);ctx.fillStyle='#351d27';ctx.fillRect(x-16,y-size-7,32,4);ctx.fillStyle='#6ee7b7';ctx.fillRect(x-16,y-size-7,32*Math.max(0,e.hp/e.max),4)}for(let f of game.effects){ctx.strokeStyle=f.laser?'#f0abfc':'#fde68a';ctx.lineWidth=f.laser?4:2;ctx.beginPath();if(f.kind==='boom'){ctx.fillStyle='#fb923c55';ctx.arc((f.x+.5)*S,(f.y+.5)*S,(1-f.life/.35)*S*1.2,0,Math.PI*2);ctx.fill()}else{ctx.moveTo((f.x+.5)*S,(f.y+.5)*S);ctx.lineTo((f.tx+.5)*S,(f.ty+.5)*S)}ctx.stroke()}}
}
let last=0;function loop(t){let dt=Math.min((t-last)/1000,.05);last=t;if(game){step(dt);draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&!game.done){game.paused=true;if($('#pause'))$('#pause').textContent='▶ Continuar'}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});home();
</script></body></html>
